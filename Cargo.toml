[workspace]
resolver = "3"
members = [
    "modules/ayagami",
    "modules/ayagami-render",
    "demos/ayagami-demo",
]

# Interactive deformation and ABI compatibility tests are too slow without
# optimization. Keep this override here because workspace members do not use
# profile settings from their own manifests.
[profile.dev.package.ayagami]
opt-level = 3
debug = 0
