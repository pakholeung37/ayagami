[workspace]
resolver = "3"
members = [
    "crates/ayagami",
    "crates/ayagami-render",
    "apps/ayagami-demo",
    "experiments/cubism-core-shim",
]

# The ABI experiment is exercised in debug builds, but deformation is too slow
# without optimization. Keep these overrides here because workspace members do
# not use profile settings from their own manifests.
[profile.dev.package.ayagami]
opt-level = 3
debug = 0

[profile.dev.package.ayagami-cubism-core]
opt-level = 3
debug = 1
